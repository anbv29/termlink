[package]
name = "termlink"
version = "0.1.0"
edition = "2024"
description = "A beginner-friendly terminal chat application"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"] }

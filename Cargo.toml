[package]
name = "termlink"
version = "0.1.0"
edition = "2024"
description = "A beginner-friendly terminal chat application"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "mysql", "runtime-tokio"] }
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
